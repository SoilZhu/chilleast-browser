name: CI Checks

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm install
          cd web && npm install && cd ..
          cd worker && npm install && cd ..

      - name: Run worker unit tests and typecheck
        run: |
          cd worker
          npm test
          npm run typecheck

      - name: Run web production build
        run: |
          cd web
          npm run build

      - name: Run UI and backup verification
        run: |
          npm run ui:check
          npm run sync:check
