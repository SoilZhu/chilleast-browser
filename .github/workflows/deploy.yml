name: Deploy Cloudflare Worker & Web

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root and workspace dependencies
        run: |
          npm install
          cd web && npm install && cd ..
          cd worker && npm install && cd ..

      - name: Run worker tests and typecheck
        run: |
          cd worker
          npm test
          npm run typecheck

      # ---- 生产环境 (main 分支 -> web.chilleast.soilzhu.su) ----
      - name: Build Web for Production
        if: github.ref == 'refs/heads/main'
        run: |
          cd web
          npm run build

      - name: Deploy to Cloudflare Production
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # ---- 测试环境 (dev 分支 -> dev.web.chilleast.soilzhu.su) ----
      - name: Build Web for Dev Environment
        if: github.ref == 'refs/heads/dev'
        run: |
          cd web
          VITE_API_BASE=https://dev.api.chilleast.soilzhu.su npm run build

      - name: Deploy to Cloudflare Dev Environment
        if: github.ref == 'refs/heads/dev'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --env dev
